name: Validate Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Validate package manifests and integrity
        run: python3 scripts/validate-package.py

      - name: Validate Skills CLI discovery
        run: npx --yes skills@1.5.25 add . --list

      - name: Validate Claude Code plugin & marketplace
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.237
          claude plugin validate .
